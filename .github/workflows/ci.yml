name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests (offline, mocked API responses)
        run: python -m unittest discover tests/ '*test.py'

  # The oldest dependency versions still allowed by pyproject.toml, so the
  # declared lower bounds stay honest.
  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install with the lowest allowed dependencies
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e .
      - name: Unit tests
        run: python -m unittest discover tests/ '*test.py'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel installs and imports cleanly
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import wikipedia; print(wikipedia.__version__)"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
