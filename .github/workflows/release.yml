name: Release

# Publishes to PyPI when a GitHub release is published (tag e.g. v1.4.1).
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
# One-time setup by a PyPI owner of "wikipedia":
#   pypi.org > project wikipedia > Settings > Publishing > Add a new publisher
#   (GitHub): owner goldsmith, repository Wikipedia, workflow release.yml,
#   environment pypi.
# Also create a GitHub environment named "pypi" (Settings > Environments);
# adding required reviewers there makes every upload wait for approval.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print('.'.join(re.search(r'__version__ = \((\d+), (\d+), (\d+)\)', open('wikipedia/__init__.py').read()).groups()))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg __init__=$init tag=$tag"
          [ "$pkg" = "$tag" ] && [ "$init" = "$tag" ] || { echo "::error::version mismatch"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
