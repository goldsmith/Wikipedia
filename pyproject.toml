[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia"
dynamic = ["version", "dependencies"]
description = "Wikipedia API for Python"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonathan Goldsmith", email = "jhghank@gmail.com"}]
keywords = ["python", "wikipedia", "API"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/goldsmith/Wikipedia"
Documentation = "https://wikipedia.readthedocs.io/"
Issues = "https://github.com/goldsmith/Wikipedia/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2", "twine>=6,<8", "ruff>=0.11,<1"]
docs = ["sphinx>=7,<10"]

[tool.setuptools]
packages = ["wikipedia"]

[tool.setuptools.dynamic]
version = {attr = "wikipedia.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
